[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[project]
name = "tethering"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
"pyyaml",
"jinja2"
]
 
[project.scripts]
clm-run = "tethering.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "pytest-mock", "black"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tethering*"]

[tool.setuptools.package-data]
tethering = ["templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "pbs: marks tests that require a PBS scheduler (deselect with '-m not pbs')",
]

[tool.black]
target-version = ["py310", "py311", "py312"]
line-length = 88 