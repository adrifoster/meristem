#
# smoke test pipeline for tethering using ABBY NEON site
# Usage:
#   export TETHERING_REPO=/path/to/tethering
#   bash $TETHERING_REPO/tests/smoke/submit_smoke_test.sh
 
root: $TETHERING_REPO/tests/smoke/cases
run_id: smoke_ABBY                      
 
stages:
  - name: spinup_ad
    script: $TETHERING_REPO/tests/smoke/scripts/run_job_ad.sh             
    queue: develop

  - name: spinup_sasu
    script: $TETHERING_REPO/tests/smoke/scripts/run_job_sasu.sh
    queue: develop
 
  - name: spinup_postad
    script: $TETHERING_REPO/tests/smoke/scripts/run_job_postad.sh
    queue: develop
 
  - name: smoke_check
    script: $TETHERING_REPO/tests/smoke/scripts/smoke_check.sh
    queue: develop
    no_cime: True
