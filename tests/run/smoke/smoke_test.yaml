#
# smoke test pipeline for meristem.run using a NEON single-site (ABBY) spinup
#
# Don't use this file directly: submit_smoke_test.sh sets the variables below
# from smoke_settings.sh and then creates and submits the run.

root: $SMOKE_ROOT
run_id: smoke_ABBY
project: $PROJECT

stages:
  - name: spinup_ad
    script: $SMOKE_DIR/scripts/run_job_ad.sh
    queue: develop

  - name: spinup_sasu
    script: $SMOKE_DIR/scripts/run_job_sasu.sh
    queue: develop

  - name: spinup_postad
    script: $SMOKE_DIR/scripts/run_job_postad.sh
    queue: develop

  - name: smoke_check
    script: $SMOKE_DIR/scripts/smoke_check.sh
    queue: develop
    no_cime: true
