name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.4.0
        with: 
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --tb=short -m "not slow and not pbs" --cov=meristem --cov-report=term-missing --cov-fail-under=95
  
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pylint
        run: pylint src/meristem --fail-under=9.9
      - name: black 
        run: black --check src tests
          
      